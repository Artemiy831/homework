<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP.CO</title>
  <link href="css/swiper-bundle.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="body">
  <div class="wrapper">
    <header class="header">
      <div class="header__top">
        <div class="container">
          <div class="header__top-inner">
            <a class="header__logo" href="#">
              <img src="img/icons/logos/SHOP.CO.svg" alt="Логотип компании SHOP.CO">
            </a>
            <nav class="nav">
              <ul class="nav__list">
                <li class="nav__item">
                  <a class="nav__link" href="#">
                    Магазин
                    <img class="nav__arrow-img" src="img/decor/arrow-down.svg" alt="">
                  </a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">
                    Скидки
                  </a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">
                    Новые поступления
                  </a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">
                    Бренды
                  </a>
                </li>
              </ul>
            </nav>
            <a class="burger-icon" href="#">
              <span></span>
            </a>
          </div>
        </div>
      </div>


      <section class="header__hero hero">
        <div class="container">
          <div class="hero__inner">
            <div class="hero__content">
              <h1 class="hero__title title">
                НАЙДИ ОДЕЖДУ КОТОРАЯ ВЫРАЗИТ ТВОЙ СТИЛЬ
              </h1>
              <p class="hero__text">
                Просмотрите наш набор тщательно сделанной одежды, созданный чтобы подчеркнуть ваш индивидуальный стиль.
              </p>
              <a class="hero__button button" href="#">
                Купить сейчас
              </a>
            </div>
            <div class="hero__statistics statistics">
                <span class="hero__statistics-number">200+</span>
                <span class="hero__statistics-text">Всемирных брендов</span>
                <img src="img/decor/Line-divider.svg" alt="">
                <span class="hero__statistics-number">2,000+</span>
                <span class="hero__statistics-text">Качественных товаров</span>
                <img src="img/decor/Line-divider.svg" alt="">
                <span class="hero__statistics-number">30,000+</span>
                <span class="hero__statistics-text">Счастливых клиентов</span>
            </div>
          </div>
        </div>
      </section>
    </header>

    <main class="main"></main>

    <footer class="footer"></footer>
  </div>

</body>

</html>
